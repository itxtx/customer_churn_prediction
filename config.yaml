# Data Configuration
data:
  raw_data_path: "data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv"
  test_size: 0.2
  random_state: 42

# Feature Configuration
features:
  target_column: "Churn"
  customer_id_column: "customerID"

  numeric_features:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"

  categorical_features:
    - "gender"
    - "SeniorCitizen"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"

  engineered_features:
    - "MonthlyToTotalRatio"
    - "NumAdditionalServices"
    - "HasInternetService"

# Model Configuration
models:
  output_dir: "models/"
  final_model_path: "models/final_model.joblib"
  registry_repo: "itxtx/customer-churn-prediction"
  training_report_path: "models/training_report.json"

# Training Configuration
training:
  models_to_train:
    - "logistic"
    - "random_forest"
    - "gradient_boosting"
    - "xgboost"
  cv_folds: 5
  scoring_metric: "f1"
  n_iter_search: 20
  tuning_strategy: "random"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "app.log"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  reload: true
